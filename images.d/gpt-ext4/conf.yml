# gpt-ext4 assembles the rootfs into a minimized ext4 partition and places it on
# a GPT disk image. It uses the locally built reproducible mke2fs/resize2fs and
# mv_data, with fdisk (sfdisk) from the mirror for the partition table, and
# python3 to run the assembly script.
debian_tooling:
  - fdisk
  - python3-minimal
local_tooling:
  - e2fsprogs:e2fsprogs
  - e2fsprogs:logsave
  - e2fsprogs:libext2fs2t64
  - e2fsprogs:libcom-err2
  - e2fsprogs:libss2
  - mv-data:mv-data
