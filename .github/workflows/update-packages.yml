name: update-packages

# The run-list title; the sidebar keeps the workflow name above. A dispatch has no
# meaningful commit to name the run after, so title it by the branch it targets.
run-name: update-packages (${{ inputs.target-branch || 'main' }})

# Manual (and, once enabled, daily) entrypoint for the package-update pass: build
# glbx, check every selected package for a newer version, and fan out one
# update-one-package call per updatable package. The target branch is pure data,
# so this can run from main while opening PRs against another branch.
on:
  workflow_dispatch:
    inputs:
      dist:            { type: "string",  default: "testing",                         description: "dist to pull from (override with a snapshot dist to replay a point in time)" }
      glbx-ref:        { type: "string",  default: "main",                            description: "glbx ref (branch, tag, or full SHA) to build the executor from" }
      repo:            { type: "string",  default: "https://deb.debian.org/debian",   description: "APT repository URL to pull from" }
      target-branch:   { type: "string",  default: "main",                            description: "branch to check updates for and open PRs against" }
      update-lockfile: { type: "boolean", default: false,                             description: "also bump the build-deps lockfile on the clean path" }
      update-tag:      { type: "string",  default: "debian:testing",                  description: "auto_update tag to select packages by AND to write into imports" }
  # Daily cron — disabled for the initial PoC. The params job below supplies the
  # cron's parameters (the dispatch inputs are empty on a schedule trigger), so
  # uncommenting this line is the only change needed to enable unattended runs.
  # schedule:
  #   - cron: "23 4 * * *"     # off-peak, non-:00 minute

jobs:
  # Resolve the run's parameters once: each takes its workflow_dispatch input, or
  # the default below when none was given (dispatch input defaults apply only on a
  # manual run — on the future schedule trigger inputs is empty). Downstream jobs
  # read needs.params.outputs.* — the only place the || fallback lives, and the one
  # context allowed both in with: on a reusable-workflow call and in shell steps.
  params:
    runs-on: ubuntu-latest
    outputs:
      target-branch:   ${{ steps.resolve.outputs.target-branch }}
      update-tag:      ${{ steps.resolve.outputs.update-tag }}
      repo:            ${{ steps.resolve.outputs.repo }}
      dist:            ${{ steps.resolve.outputs.dist }}
      update-lockfile: ${{ steps.resolve.outputs.update-lockfile }}
      glbx-ref:        ${{ steps.resolve.outputs.glbx-ref }}
    steps:
      - id: resolve
        run: |
          {
            echo "target-branch=${{   inputs.target-branch   || 'main' }}"
            echo "update-tag=${{       inputs.update-tag      || 'debian:testing' }}"
            echo "repo=${{             inputs.repo            || 'https://deb.debian.org/debian' }}"
            echo "dist=${{             inputs.dist            || 'testing' }}"
            echo "update-lockfile=${{  inputs.update-lockfile || 'false' }}"
            echo "glbx-ref=${{         inputs.glbx-ref        || 'main' }}"
          } >> "$GITHUB_OUTPUT"

  build-glbx:
    needs: [params]
    uses: ./.github/workflows/build-glbx.yml
    with:
      glbx-ref: ${{ needs.params.outputs.glbx-ref }}

  check:
    needs: [params, build-glbx]
    runs-on: ubuntu-latest
    env:
      REPO:       ${{ needs.params.outputs.repo }}
      DIST:       ${{ needs.params.outputs.dist }}
      UPDATE_TAG: ${{ needs.params.outputs.update-tag }}
    outputs:
      updates: ${{ steps.check.outputs.updates }}
      any: ${{ steps.check.outputs.any }}
    steps:
      - name: Check out the target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.params.outputs.target-branch }}
          fetch-depth: 0
      - name: Check out the workflow ref for the glbx-bin action and keyring
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .wf
      - uses: ./.wf/.github/actions/glbx-bin
      - name: Resolve which packages have a newer version
        id: check
        run: |
          # One cookie per run so check-updates and every later import share one
          # signed InRelease snapshot of the archive.
          updates="$(bin/glbx check-updates \
            --conf-dir . \
            --repo "$REPO" \
            --dist "$DIST" \
            --update-tag "$UPDATE_TAG" \
            --keyring .wf/.github/keyrings/debian-archive-keyring.gpg \
            --cookie '${{ github.run_id }}' \
            --format json)"
          echo "updates=$updates" >> "$GITHUB_OUTPUT"
          if [ "$(echo "$updates" | jq 'length')" -gt 0 ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi
          echo "updatable: $(echo "$updates" | jq -c '[.[].pkg]')"

  update:
    needs: [params, check]
    if: needs.check.outputs.any == 'true'
    name: ${{ matrix.pkg.pkg }}
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.check.outputs.updates) }}
    uses: ./.github/workflows/update-one-package.yml
    with:
      pkg: ${{ matrix.pkg.pkg }}
      old: ${{ matrix.pkg.old }}
      new: ${{ matrix.pkg.new }}
      target-branch: ${{ needs.params.outputs.target-branch }}
      update-tag: ${{ needs.params.outputs.update-tag }}
      repo: ${{ needs.params.outputs.repo }}
      dist: ${{ needs.params.outputs.dist }}
      update-lockfile: ${{ needs.params.outputs.update-lockfile == 'true' }}
      cookie: ${{ github.run_id }}
    secrets: inherit
