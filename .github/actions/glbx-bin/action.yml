name: Fetch glbx binaries
description: Download the run-scoped glbx-bin-<arch> artifact and make the binaries executable.
inputs:
  arch:
    description: Which architecture's binaries to fetch (selects the glbx-bin-<arch> artifact).
    required: true
outputs:
  glbx:
    description: Path to the glbx binary.
    value: bin/glbx
  stub:
    description: Path to the exec_env_stub binary.
    value: bin/exec_env_stub
runs:
  using: composite
  steps:
    - name: Fetch the glbx binaries
      uses: actions/download-artifact@v7
      with:
        name: glbx-bin-${{ inputs.arch }}
        path: bin
    - name: Make the binaries executable
      shell: bash
      run: chmod +x bin/glbx bin/exec_env_stub
