name: build-glbx

# Reusable: compile glbx and the sandbox stub from a glbx ref for every shipped
# architecture and share each pair of binaries with the jobs that need them as
# run-scoped artifacts (glbx-bin-amd64, glbx-bin-arm64). glbx is pure Go, so one
# runner cross-compiles both arches via `make cross`; only the native per-node
# image build runs on its own architecture (handled by the node runner map).
on:
  workflow_call:
    inputs:
      glbx-ref:
        description: glbx ref (branch, tag, or full SHA) to build the executor from
        default: main
        type: string

jobs:
  build-glbx:
    runs-on: ubuntu-latest
    steps:
      - name: Check out glbx
        uses: actions/checkout@v5
        with:
          repository: gardenlinux/glbx
          ref: ${{ inputs.glbx-ref || 'main' }}
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Install protobuf toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - name: Cross-compile glbx and the sandbox stub for every arch
        run: make cross
      - name: Share the amd64 binaries with the node jobs
        uses: actions/upload-artifact@v6
        with:
          name: glbx-bin-amd64
          path: bin-amd64/
          retention-days: 1
      - name: Share the arm64 binaries with the node jobs
        uses: actions/upload-artifact@v6
        with:
          name: glbx-bin-arm64
          path: bin-arm64/
          retention-days: 1
