name: update-one-package

# Reusable: import one package's new upstream version as a pristine commit, open
# a staging branch and a PR into the target. A clean three-way merge becomes a
# normal PR with the merge already made; a conflict becomes a draft PR whose
# branch is just the pristine import, with resolution instructions and a
# greppable state block for the /continue-update handler to finish.
on:
  workflow_call:
    inputs:
      pkg:             { required: true,  type: string }
      old:             { required: true,  type: string }
      new:             { required: true,  type: string }
      target-branch:   { required: true,  type: string }
      update-tag:      { required: true,  type: string }
      repo:            { required: true,  type: string }
      dist:            { required: true,  type: string }
      update-lockfile: { default: false,  type: boolean }
      auto-merge:      { default: false,  type: boolean }
      cookie:          { required: true,  type: string }

permissions:
  contents: write
  pull-requests: write

jobs:
  update-one:
    runs-on: ubuntu-latest
    name: ${{ inputs.pkg }} ${{ inputs.old }} → ${{ inputs.new }}
    env:
      PKG: ${{ inputs.pkg }}
      OLD: ${{ inputs.old }}
      NEW: ${{ inputs.new }}
      TARGET: ${{ inputs.target-branch }}
      UPDATE_TAG: ${{ inputs.update-tag }}
      REPO: ${{ inputs.repo }}
      DIST: ${{ inputs.dist }}
      UPDATE_LOCKFILE: ${{ inputs.update-lockfile }}
      AUTO_MERGE: ${{ inputs.auto-merge }}
      COOKIE: ${{ inputs.cookie }}
    steps:
      - name: Mint a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GLBF_UPDATE_APP_ID }}
          private-key: ${{ secrets.GLBF_UPDATE_APP_KEY }}

      - name: Check out the target branch (full history)
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target-branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Check out the workflow ref for the helper lib and keyring
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .wf
      - uses: ./.wf/.github/actions/glbx-bin
        with:
          arch: amd64

      - name: Resolve the bot user id for the commit identity
        id: bot-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: echo "user-id=$(gh api "/users/${SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        env:
          SLUG: ${{ steps.app-token.outputs.app-slug }}
          UID: ${{ steps.bot-id.outputs.user-id }}
        run: |
          git config user.name "${SLUG}[bot]"
          git config user.email "${UID}+${SLUG}[bot]@users.noreply.github.com"
          # The workflow-ref checkout lives at .wf inside the workspace; keep it
          # out of every git operation on the target tree so it is never staged.
          echo '/.wf/' >> .git/info/exclude

      - name: Import the new version as a pristine commit (no merge)
        id: import
        run: |
          result="$(glbx import --no-merge \
            --update-tag "$UPDATE_TAG" \
            --params "repo=$REPO,dist=$DIST,cookie=$COOKIE,keyring=.wf/.github/keyrings/debian-archive-keyring.gpg" \
            "debian:$PKG")"
          echo "$result"
          commit="$(echo "$result" | jq -r '.commit')"
          already="$(echo "$result" | jq -r '.already_present')"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "already=$already" >> "$GITHUB_OUTPUT"

      - name: Open or update the PR
        if: steps.import.outputs.already != 'true' && steps.import.outputs.commit != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          source .wf/.github/update-lib.sh

          U="${{ steps.import.outputs.commit }}"
          branch="$(branch_name "$TARGET" "$PKG" "$NEW")"
          echo "import commit U=$U branch=$branch"

          # A branch that already exists (an earlier run for this exact version)
          # is a guardrail stop for the PoC: supersession is a later concern.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::notice::$branch already exists; skipping (supersession is out of scope for now)"
            exit 0
          fi

          # Do the real merge once on the staging branch, preserving U's
          # ancestry (never squash/rebase). Three outcomes: a clean three-way
          # merge; a merge that conflicts but the package's pkg_type can
          # auto-resolve (the kernel regenerates its generated debian/control);
          # or a conflict nothing automatic can fix. The first two become a
          # normal PR with the merge made; the third a draft PR whose branch is
          # just the pristine import U.
          git checkout -B "$branch" "origin/$TARGET"
          if git merge --no-ff --no-edit "$U"; then
            resolved=1
          elif glbx resolve-conflicts \
                 --params "repo=$REPO,dist=$DIST,cookie=$COOKIE" \
                 "$PKG"; then
            # resolve-conflicts regenerated and git-added the files its pkg_type
            # owns and left no unmerged entries; finalize the merge commit it set
            # up (it never commits — the caller owns the commit).
            git commit --no-edit
            resolved=1
          else
            # Either no auto-resolution strategy for this pkg_type, or conflicts
            # remain that it could not fix. The partial auto-resolution (if any)
            # is NOT a complete, non-conflicting commit, so it must not be pushed:
            # abort back to a clean tree and fall through to the draft-PR path,
            # whose branch is only the pristine import U — exactly as before.
            git merge --abort 2>/dev/null || true
            resolved=0
          fi

          if [ "$resolved" = 1 ]; then
            if [ "$UPDATE_LOCKFILE" = "true" ]; then
              glbx lockfile \
                --params "repo=$REPO,dist=$DIST,cookie=$COOKIE" \
                "pkg:$PKG"
              git add "pkgs/$PKG"
              git commit -m "update $PKG build deps"
            fi

            git push origin "$branch"

            body="$(clean_body "$PKG" "$OLD" "$NEW" "$TARGET" "$UPDATE_TAG" "$REPO" "$DIST" "$UPDATE_LOCKFILE" "$U" "$AUTO_MERGE")"
            gh pr create --base "$TARGET" --head "$branch" \
              --title "update $PKG $OLD → $NEW" \
              --body "$body"
          else
            # Conflict: the branch is JUST the pristine import U. The maintainer
            # merges the target in locally and pushes; a draft PR carries the
            # instructions and the state block.
            git push origin "$U:refs/heads/$branch"

            git checkout -B "$branch" "origin/$TARGET"
            git merge --no-commit --no-ff "$U" >/dev/null 2>&1 || true
            pathlist="$(git diff --name-only --diff-filter=U | format_conflict_paths)"
            git merge --abort 2>/dev/null || true

            body="$(conflict_body "$PKG" "$OLD" "$NEW" "$TARGET" "$UPDATE_TAG" "$REPO" "$DIST" "$UPDATE_LOCKFILE" "$U" "$branch" "$pathlist" "$AUTO_MERGE")"
            gh pr create --draft --base "$TARGET" --head "$branch" \
              --title "update $PKG $OLD → $NEW (needs conflict resolution)" \
              --body "$body"
          fi
